<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheff Production - Home</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="homescreen">
        <!-- Центральная накладка с логотипом -->
        <div class="center-overlay">
            <h1 class="logo-main">SHEFF <br>PRODUCTION</h1>
            <h2 class="logo-subtitle">Photography & Videography</h2>
        </div>

        <!-- Левая секция - Corporate -->
        <section class="split-section corporate-section">
            <div class="section-overlay"></div>
            <div class="section-content1">
                <div class="section-title">Corporate</div>
                <div class="section-line"></div>
                <div class="section-subtitle">Events & Executive Portraits</div>
            </div>
        </section>

        <!-- Правая секция - Weddings -->
        <section class="split-section wedding-section">
            <div class="section-overlay"></div>
            <div class="section-content2">
                <div class="section-title">Weddings</div>
                <div class="section-line"></div>
                <div class="section-subtitle">Celebrations & Moments</div>
            </div>
        </section>
    </main>

    <script src="scripts.js/script.js"></script>
</body>
</html>
